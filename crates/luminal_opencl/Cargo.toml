[package]
name = "luminal_opencl"
version = "0.2.0"
edition = "2024"
description = "OpenCL backend for Luminal, targeting Snapdragon X Elite"
license = "MIT OR Apache-2.0"

[dependencies]
luminal = { path = "../.." }
opencl3 = "0.12.3"
half = { version = "2.7.1", features = ["bytemuck"] }
bytemuck = "1.24.0"
itertools = "0.12.1"

[dev-dependencies]
luminal_nn = { path = "../luminal_nn" }

